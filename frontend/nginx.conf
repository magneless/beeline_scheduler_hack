server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_backend backend:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 360s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
