services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    init: true
    environment:
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scheduler?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      DEPENDENCY_MODE: integrated-demo
      SOLVER_MODE: ${SOLVER_MODE:-optimized}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  backend-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    init: true
    environment:
      TEST_DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scheduler?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  client:
    build:
      context: ./client
      target: preview
      args:
        VITE_API_MODE: live
        VITE_API_URL: /api/v1
        VITE_YANDEX_MAPS_KEY: ${VITE_YANDEX_MAPS_KEY:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
