services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    init: true
    environment:
      DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/scheduler?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      DEPENDENCY_MODE: ${DEPENDENCY_MODE:-integrated}
      GEO_PROVIDER: ${GEO_PROVIDER:-osm}
      GEO_PHOTON_URL: ${GEO_PHOTON_URL:-https://photon.komoot.io}
      GEO_OSRM_CAR_URL: ${GEO_OSRM_CAR_URL:-https://routing.openstreetmap.de/routed-car}
      GEO_OSRM_FOOT_URL: ${GEO_OSRM_FOOT_URL:-https://routing.openstreetmap.de/routed-foot}
      GEO_USER_AGENT: ${GEO_USER_AGENT:-beeline-scheduler/1.0 (https://github.com/magneless/beeline_scheduler_hack)}
      GEO_MIN_INTERVAL_MS: ${GEO_MIN_INTERVAL_MS:-0}
      GEO_CACHE_DIR: /var/cache/scheduler
      SOLVER_MODE: ${SOLVER_MODE:-optimized}
      SOLVER_TIME_LIMIT_MS: ${SOLVER_TIME_LIMIT_MS:-10000}
    volumes:
      - geo_cache:/var/cache/scheduler
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  backend-test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    init: true
    environment:
      TEST_DATABASE_URL: postgres://scheduler:${POSTGRES_PASSWORD:-change-me-local}@postgres:5432/scheduler?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      target: preview
      args:
        VITE_API_MODE: live
        VITE_API_URL: /api/v1
        VITE_YANDEX_MAPS_KEY: ${VITE_YANDEX_MAPS_KEY:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  geo_cache:
